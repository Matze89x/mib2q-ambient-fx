<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="AmbientFX Phase 1: LED-Streifen werden gesteuert, passive LED-Beleuchtung bleibt manuell / LED strips are controlled, passive LED lighting stays manual">
  <title>AmbientFX Phase 1 - LED-Streifen / LED strips</title>
  <defs>
    <linearGradient id="strip" gradientUnits="userSpaceOnUse" x1="180" x2="540" y1="0" y2="0">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="0.5" stop-color="#b45cff"/>
      <stop offset="1" stop-color="#4fc3ff"/>
    </linearGradient>
    <linearGradient id="stripV" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="150" y2="382">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="0.5" stop-color="#b45cff"/>
      <stop offset="1" stop-color="#4fc3ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; fill: #e8ebf2; }
      .muted { fill: #9aa3b5; }
      .small { font-size: 12px; }
      .lbl { font-size: 13px; }
      .seat { fill: #151a24; stroke: #262d3b; stroke-width: 1.5; }
      .pass { fill: rgba(154,163,181,0.10); stroke: #8b93a6; stroke-width: 2; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="720" height="560" rx="18" fill="#0b0e14"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700">AmbientFX · Phase 1</text>
  <text x="360" y="54" text-anchor="middle" class="muted small">Draufsicht, schematisch, nicht maßstabsgetreu · top view, schematic, not to scale</text>

  <!-- cabin -->
  <rect x="150" y="82" width="420" height="316" rx="46" fill="#10141c" stroke="#262d3b" stroke-width="2"/>
  <!-- dashboard -->
  <path d="M176 108 Q360 88 544 108 L544 140 Q360 124 176 140 Z" fill="#151a24" stroke="#262d3b" stroke-width="1.5"/>
  <!-- seats -->
  <rect class="seat" x="200" y="214" width="84" height="84" rx="16"/>
  <rect class="seat" x="436" y="214" width="84" height="84" rx="16"/>
  <rect class="seat" x="200" y="318" width="84" height="56" rx="14"/>
  <rect class="seat" x="436" y="318" width="84" height="56" rx="14"/>
  <rect class="seat" x="320" y="318" width="80" height="56" rx="14"/>
  <!-- direction -->
  <text x="360" y="76" text-anchor="middle" class="muted small">▲ Fahrtrichtung / driving direction</text>

  <!-- passive: footwell (front) -->
  <ellipse class="pass" cx="228" cy="176" rx="40" ry="20"/>
  <ellipse class="pass" cx="492" cy="176" rx="40" ry="20"/>
  <!-- passive: centre console / cup holder -->
  <rect class="pass" x="326" y="204" width="68" height="46" rx="12"/>
  <circle class="pass" cx="344" cy="228" r="9"/>
  <circle class="pass" cx="376" cy="228" r="9"/>

  <!-- controlled strips -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round">
    <path d="M186 118 Q360 100 534 118" stroke="url(#strip)" stroke-width="5"/>
    <rect x="157.5" y="150" width="5" height="112" rx="2.5" fill="url(#stripV)" stroke="none"/>
    <rect x="157.5" y="272" width="5" height="110" rx="2.5" fill="url(#stripV)" stroke="none"/>
    <rect x="557.5" y="150" width="5" height="112" rx="2.5" fill="url(#stripV)" stroke="none"/>
    <rect x="557.5" y="272" width="5" height="110" rx="2.5" fill="url(#stripV)" stroke="none"/>
  </g>

  <!-- callouts -->
  <g class="lbl">
    <text x="360" y="150" text-anchor="middle" class="small" style="fill:#e8ebf2">LED-Streifen Armaturenbrett · dash strip</text>
    <text x="146" y="196" text-anchor="end" class="small">Tür vorn</text>
    <text x="146" y="212" text-anchor="end" class="small muted">front door</text>
    <text x="146" y="324" text-anchor="end" class="small">Tür hinten</text>
    <text x="146" y="340" text-anchor="end" class="small muted">rear door</text>
    <text x="574" y="196" text-anchor="start" class="small">Tür vorn</text>
    <text x="574" y="212" text-anchor="start" class="small muted">front door</text>
    <text x="574" y="324" text-anchor="start" class="small">Tür hinten</text>
    <text x="574" y="340" text-anchor="start" class="small muted">rear door</text>
    <text x="228" y="206" text-anchor="middle" class="small muted">Fußraum</text>
    <text x="492" y="206" text-anchor="middle" class="small muted">Fußraum</text>
    <text x="360" y="268" text-anchor="middle" class="small muted">Getränkehalter</text>
  </g>

  <!-- legend -->
  <g transform="translate(40 424)">
    <rect x="0" y="0" width="640" height="116" rx="12" fill="#10141c" stroke="#262d3b"/>
    <g filter="url(#glow)"><rect x="20" y="19" width="44" height="5" rx="2.5" fill="#b45cff"/></g>
    <text x="80" y="26" class="lbl" style="font-weight:700">LED-Streifen (Kontur) · LED strips (contour)</text>
    <text x="80" y="44" class="small muted">Armaturenbrett und Türen (vorn und hinten). Werden von AmbientFX gesteuert.</text>
    <text x="80" y="60" class="small muted">Dash and doors (front and rear). Controlled by AmbientFX.</text>
    <line x1="20" y1="82" x2="64" y2="82" stroke="#8b93a6" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>
    <text x="80" y="86" class="lbl" style="font-weight:700">Passive LED-Beleuchtung · passive LED lighting</text>
    <text x="80" y="104" class="small muted">z. B. Fußraum, Getränkehalter. Weiterhin manuell im Auto einstellbar, später auch mit AmbientFX.</text>
  </g>
</svg>
