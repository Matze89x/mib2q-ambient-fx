<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 726" role="img" aria-label="AmbientFX Phase 1: Kontur-LED-Streifen an Armaturenbrett und allen vier Türen werden gesteuert, passive Flächenbeleuchtung bleibt manuell / contour LED strips on the instrument panel and all four doors are controlled, passive surface lighting stays manual">
  <title>AmbientFX Phase 1 - Kontur / contour</title>
  <defs>
    <linearGradient id="hz" gradientUnits="userSpaceOnUse" x1="236" x2="564" y1="0" y2="0">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="0.5" stop-color="#b45cff"/>
      <stop offset="1" stop-color="#4fc3ff"/>
    </linearGradient>
    <linearGradient id="vz" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="196" y2="484">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="0.5" stop-color="#b45cff"/>
      <stop offset="1" stop-color="#4fc3ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b26"/>
      <stop offset="1" stop-color="#0e121a"/>
    </linearGradient>
    <style>
      text { font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; fill: #e8ebf2; }
      .muted { fill: #9aa3b5; }
      .s { font-size: 12.5px; }
      .m { font-size: 14px; font-weight: 700; }
      .seat { fill: #19202c; stroke: #2a3242; stroke-width: 1.5; }
      .pass { fill: rgba(139,147,166,0.13); stroke: #8b93a6; stroke-width: 2; stroke-dasharray: 6 5; }
      .chk { fill: none; stroke: #c9a85a; stroke-width: 2; stroke-dasharray: 2 5; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="800" height="726" rx="20" fill="#0b0e14"/>
  <text x="400" y="38" text-anchor="middle" font-size="21" font-weight="700">AmbientFX · Phase 1</text>
  <text x="400" y="60" text-anchor="middle" class="muted s">Draufsicht, schematisch, nicht maßstabsgetreu · top view, schematic, not to scale</text>
  <text x="400" y="84" text-anchor="middle" class="muted s">▲ Fahrtrichtung / driving direction</text>

  <!-- body -->
  <rect x="196" y="96" width="408" height="402" rx="64" fill="url(#body)" stroke="#2a3242" stroke-width="2"/>
  <path d="M232 106 Q400 92 568 106" fill="none" stroke="#2a3242" stroke-width="2"/>
  <!-- instrument panel -->
  <path d="M224 118 Q400 98 576 118 L576 168 Q400 150 224 168 Z" fill="#1b2230" stroke="#2a3242" stroke-width="1.5"/>
  <!-- steering wheel (left-hand drive) -->
  <ellipse cx="290" cy="202" rx="26" ry="13" fill="none" stroke="#3a4458" stroke-width="5"/>
  <line x1="290" y1="202" x2="290" y2="215" stroke="#3a4458" stroke-width="4" stroke-linecap="round"/>
  <circle cx="290" cy="202" r="4" fill="#3a4458"/>
  <text x="290" y="180" text-anchor="middle" class="s muted" style="font-size:10px">Lenkrad</text>
  <!-- seats -->
  <rect class="seat" x="248" y="272" width="84" height="88" rx="18"/>
  <rect class="seat" x="468" y="272" width="84" height="88" rx="18"/>
  <rect class="seat" x="236" y="416" width="328" height="58" rx="20"/>

  <!-- door panels (surface lighting, passive) -->
  <rect class="pass" x="158" y="196" width="34" height="132" rx="10"/>
  <rect class="pass" x="158" y="352" width="34" height="132" rx="10"/>
  <rect class="pass" x="608" y="196" width="34" height="132" rx="10"/>
  <rect class="pass" x="608" y="352" width="34" height="132" rx="10"/>

  <!-- footwell front (passive) -->
  <ellipse class="pass" cx="290" cy="244" rx="44" ry="16"/>
  <ellipse class="pass" cx="510" cy="244" rx="44" ry="16"/>
  <!-- footwell rear (passive) -->
  <ellipse class="pass" cx="290" cy="386" rx="44" ry="15"/>
  <ellipse class="pass" cx="510" cy="386" rx="44" ry="15"/>

  <!-- centre console: contour to be checked, cup holders passive -->
  <rect x="358" y="214" width="84" height="174" rx="14" fill="#1b2230" stroke="#2a3242" stroke-width="1.5"/>
  <rect class="pass" x="346" y="230" width="9" height="140" rx="4"/>
  <rect class="pass" x="445" y="230" width="9" height="140" rx="4"/>
  

  <!-- controlled contour -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round">
    <path d="M236 134 Q400 114 564 134" stroke="url(#hz)" stroke-width="5.5"/>
  </g>
  <circle class="pass" cx="381" cy="242" r="9"/>
  <circle class="pass" cx="419" cy="242" r="9"/>
  <g filter="url(#glow)">
    <rect x="194" y="200" width="5" height="124" rx="2.5" fill="url(#vz)"/>
    <rect x="194" y="356" width="5" height="124" rx="2.5" fill="url(#vz)"/>
    <rect x="601" y="200" width="5" height="124" rx="2.5" fill="url(#vz)"/>
    <rect x="601" y="356" width="5" height="124" rx="2.5" fill="url(#vz)"/>
  </g>

  <!-- labels -->
  <text x="148" y="250" text-anchor="end" class="s">Tür vorn</text>
  <text x="148" y="266" text-anchor="end" class="s muted">front door</text>
  <text x="148" y="406" text-anchor="end" class="s">Tür hinten</text>
  <text x="148" y="422" text-anchor="end" class="s muted">rear door</text>
  <text x="652" y="250" text-anchor="start" class="s">Tür vorn</text>
  <text x="652" y="266" text-anchor="start" class="s muted">front door</text>
  <text x="652" y="406" text-anchor="start" class="s">Tür hinten</text>
  <text x="652" y="422" text-anchor="start" class="s muted">rear door</text>
  <text x="400" y="188" text-anchor="middle" class="s">Armaturenbrett · dash</text>
  <text x="400" y="204" text-anchor="middle" class="s muted" style="font-size:11.5px">optional · nachgerüstet · retrofit</text>
  <text x="290" y="248" text-anchor="middle" class="s muted" style="font-size:11.5px">Fußraum</text>
  <text x="510" y="248" text-anchor="middle" class="s muted" style="font-size:11.5px">Fußraum</text>
  <text x="290" y="390" text-anchor="middle" class="s muted" style="font-size:11.5px">Fußraum</text>
  <text x="510" y="390" text-anchor="middle" class="s muted" style="font-size:11.5px">Fußraum</text>
  <text x="400" y="410" text-anchor="middle" class="s muted" style="font-size:10.5px">Mittelkonsole · nur seitlich</text>
  <text x="400" y="270" text-anchor="middle" class="s muted" style="font-size:9.5px">Getränkehalter ×2</text>

  <!-- legend -->
  <g transform="translate(40 524)">
    <rect x="0" y="0" width="720" height="178" rx="14" fill="#10141c" stroke="#2a3242"/>
    <g filter="url(#glow)"><rect x="22" y="20" width="46" height="5.5" rx="2.7" fill="#b45cff"/></g>
    <text x="86" y="27" class="m">Kontur (LED-Streifen) · contour (LED strips)</text>
    <text x="86" y="45" class="s muted">Tür-Kontur an allen vier Türen (vorn und hinten) · von AmbientFX gesteuert</text>
    <text x="86" y="61" class="s muted">Im MMI die eine Farbwahl für alles mit LED-Streifen · the MMI colour choice for everything with LED strips</text>
    <text x="86" y="77" class="s muted">Optional: Streifen ganz vorn am Armaturenbrett, nur bei eigener Nachrüstung · optional retrofit</text>

    <rect x="22" y="100" width="46" height="14" rx="5" class="pass"/>
    <text x="86" y="112" class="m">Fläche (passiv) · surface (passive)</text>
    <text x="86" y="130" class="s muted">Türtaschen, Lautsprecher, Fußraum (alle Plätze), Getränkehalter, Mittelkonsole (nur seitlich)</text>
    <text x="86" y="146" class="s muted">Im MMI die andere Farbwahl für alles Passive (30 Farben) · the other MMI colour choice</text>
    <text x="86" y="162" class="s muted">Manuell einstellbar, später auch mit AmbientFX · set manually, AmbientFX later</text>
  </g>
</svg>
